name = "noteschatai"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Build
[build]
command = "npm run build"
watch_dir = "src"

# Pages
[build.upload]
format = "modules"

# Environment variables (set via wrangler secret put)
[vars]
BETTER_AUTH_URL = "https://noteschatai.com"
# BETTER_AUTH_SECRET = "set via wrangler secret put"
# GEMINI_API_KEY = "set via wrangler secret put"
# GOOGLE_CLIENT_ID = "set via wrangler secret put"
# GOOGLE_CLIENT_SECRET = "set via wrangler secret put"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "noteschatai-db"
database_id = "your-database-id-here"

# Vectorize
[[vectorize]]
binding = "VECTORIZE"
index_name = "document-chunks"

# R2 Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "noteschatai-files"

# Queues
[[queues]]
binding = "QUEUE"
queue_name = "document-processing"

# Workers AI
[ai]
binding = "AI"

# KV for sessions/cache (optional)
# [[kv_namespaces]]
# binding = "KV"
# id = "your-kv-namespace-id"

# Durable Objects (for real-time features later)
# [[durable_objects.bindings]]
# name = "COLLABORATION"
# class_name = "CollaborationRoom"

# Observability
[observability]
enabled = true

# Tail workers for logging
[tail]
enabled = true

# Dev
[dev]
port = 8787
host = "localhost"