name = "noteschatai"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-08-24"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

# Assets
[assets]
binding = "ASSETS"
directory = "./dist"

# Environment variables (set via wrangler secret put)
[vars]
BETTER_AUTH_URL = "https://noteschatai.com"
# BETTER_AUTH_SECRET = "set via wrangler secret put"
# OPENROUTER_API_KEY = "set via wrangler secret put"
# GEMINI_API_KEY = "set via wrangler secret put"
# GOOGLE_CLIENT_ID = "set via wrangler secret put"
# GOOGLE_CLIENT_SECRET = "set via wrangler secret put"
# GITHUB_CLIENT_ID = "set via wrangler secret put"
# GITHUB_CLIENT_SECRET = "set via wrangler secret put"
# STRIPE_SECRET_KEY = "set via wrangler secret put"
# STRIPE_PUBLISHABLE_KEY = "set via wrangler secret put"
# STRIPE_WEBHOOK_SECRET = "set via wrangler secret put"
# STRIPE_PRO_PRICE_ID = "set via wrangler secret put"
# STRIPE_PLUS_PRICE_ID = "set via wrangler secret put"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "noteschatai-db"
database_id = "dbec39b9-89ea-458a-91e5-50efb8d036ad"

# Vectorize
[[vectorize]]
binding = "VECTORIZE"
index_name = "document-chunks"

# R2 Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "noteschatai-files"

# Queues (configured via Cloudflare dashboard)
# [queues]
# binding = "QUEUE"
# queue_name = "document-processing"

# Workers AI
[ai]
binding = "AI"

# KV for sessions/cache (optional)
# [[kv_namespaces]]
# binding = "KV"
# id = "your-kv-namespace-id"

# Observability
[observability]
enabled = true

# Dev
[dev]
port = 8787
host = "localhost"