    - region [ref=f153e253]:
      - generic [ref=f153e255]:
        - heading "The AI Study Assistant That Actually Remembers Your Notes" [level=2] [ref=f153e256]
        - generic [ref=f153e257]:
          - paragraph [ref=f153e258]:
            - text: NotesChatAI is a
            - strong [ref=f153e259]: free NotebookLM alternative
            - text: built for students, researchers, and lifelong learners who need more than a basic note-taking app. Unlike traditional AI chatbots that forget everything between sessions, NotesChatAI gives you persistent AI memory — a knowledge base that grows smarter with every document you upload. Whether you're studying for finals, writing a thesis, or organizing professional development materials, it keeps up with you.
          - heading "Chat With Your Documents — Not Just One at a Time" [level=3] [ref=f153e260]
          - paragraph [ref=f153e261]: Most AI tools force you into isolated notebooks. You upload PDFs to one project, notes to another, and they never connect. NotesChatAI eliminates that problem entirely. Our unified knowledge base means you can chat with your PDFs across your entire library. Ask a question like "What connects my biology notes to my chemistry textbook?" and get a real, cited answer that pulls from both sources. No other tool lets you search across courses, semesters, and years — all in one place.
          - paragraph [ref=f153e262]: Drop in your PDFs, EPUBs, lecture transcripts, YouTube video links, web pages, or audio files. NotesChatAI processes everything through our RAG pipeline, building semantic embeddings and a knowledge graph that connects ideas across your entire collection. When you upload notes and ask questions, the AI doesn't just search for keywords — it understands context, finds relationships, and delivers precise answers with page-level citations.
          - heading "Why Students Are Switching from NotebookLM" [level=3] [ref=f153e263]
          - paragraph [ref=f153e264]: Google's NotebookLM has strict source limits (50 on free, 600 on Ultra), daily chat quotas (50–5,000 depending on your plan), and — most importantly — notebook isolation. Your ML notes can't help you answer a question about your physics textbook unless you manually copy everything into one notebook. NotesChatAI removes these barriers. No source limits. No daily chat caps on Pro. And every document in one connected knowledge base.
          - paragraph [ref=f153e265]: Beyond simple Q&A, NotesChatAI generates flashcards from any document — powered by FSRS spaced repetition that adapts to your learning pace — creates practice exams from your knowledge base, and builds interactive mind maps that visualize how concepts connect. These are the study tools that make the difference between cramming and actually learning.
          - heading "Built for Real Academic Workflows" [level=3] [ref=f153e266]
          - paragraph [ref=f153e267]: NotesChatAI maintains context across weeks and months of studying. Ask follow-up questions weeks later and the AI still knows what you discussed, what documents you referenced, and what topics you're struggling with. This is persistent memory designed for the academic calendar — not a tool that resets every time you close the tab.
          - paragraph [ref=f153e268]: Export your knowledge base to Markdown, PDF, JSON, CSV, Anki decks, Obsidian, or Notion. Your data stays yours — always portable, never locked in. API access and self-hosted Docker deployment are coming soon.
          - paragraph [ref=f153e269]: Start with 50 documents on our free plan. No credit card required. Upgrade to Pro for unlimited documents and unlimited chats, with API access on the way. Whether you're a first-year undergrad or a PhD researcher, NotesChatAI is the AI study assistant that scales with your academic journey.
