          - heading "What makes NotesChatAI the better choice." [level=2] [ref=f153e180]
          - paragraph [ref=f153e181]: We studied every limitation of existing tools and built the study assistant students actually need.
        - generic [ref=f153e182]:
          - article [ref=f153e183]:
            - heading "Unified Knowledge Base" [level=3] [ref=f153e189]
            - paragraph [ref=f153e190]: No notebook silos. Every document lives in one connected knowledge base. Ask questions that span your entire library — across courses, semesters, and years.
          - article [ref=f153e191]:
            - heading "Unlimited Growth" [level=3] [ref=f153e196]
            - paragraph [ref=f153e197]: No per-notebook source caps. Add documents forever. Your knowledge base compounds over your entire academic career — the more you add, the smarter it gets.
          - article [ref=f153e198]:
            - heading "Active Recall & Quizzes" [level=3] [ref=f153e203]
            - paragraph [ref=f153e204]: Built-in flashcards with spaced repetition, multiple-choice quizzes, and practice exams. NotebookLM has nothing like this — you need separate apps.
          - article [ref=f153e205]:
            - heading "API-First Platform" [level=3] [ref=f153e209]
            - paragraph [ref=f153e210]: Full REST + GraphQL API — coming soon. Build custom study tools, integrate with your workflow, automate document processing. NotebookLM is a closed garden.
          - article [ref=f153e211]:
            - heading "Gemini-Powered" [level=3] [ref=f153e215]
            - paragraph [ref=f153e216]: Powered by Google's Gemini models today, with Claude and GPT on the roadmap. NotebookLM locks you into Google's ecosystem too — but you'll have choice with us.
          - article [ref=f153e217]:
            - heading "Own Your Data" [level=3] [ref=f153e222]
            - paragraph [ref=f153e223]: Export everything as Markdown, JSON, CSV, or Anki decks. Self-host on your own server. Your knowledge base is yours — not locked in Google's cloud.
